    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orange Party - A Third Way Forward" />
    <meta property="og:description" content="The Orange Party represents a peaceful, technology-driven path beyond traditional left-right politics through Bitcoin and free speech." />
    <link rel="manifest" href="/manifest.webmanifest">
    <script type="text/javascript">
      // GitHub Pages SPA redirect for custom domain
      var l = window.location;
      var routeSegments = l.pathname.split('/').slice(1); // Remove leading slash

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' +
        routeSegments.join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
